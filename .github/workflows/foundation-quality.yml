name: Foundation quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate --workspace @vfbiz/api
      - run: npm run verify:governance
      - run: npm run verify:api
      - run: npm run verify:apps
      - run: npm run security:audit:node

  ai-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --group test --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run alembic upgrade head --sql > /dev/null

  api-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
        env:
          POSTGRES_DB: vfbiz_api_integration
          POSTGRES_USER: vfbiz_integration
          POSTGRES_PASSWORD: vfbiz_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfbiz_integration -d vfbiz_api_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VFBIZ_DATABASE_URL: postgresql://vfbiz_integration:vfbiz_integration@127.0.0.1:5432/vfbiz_api_integration
      VFBIZ_TEST_DATABASE_URL: postgresql://vfbiz_integration:vfbiz_integration@127.0.0.1:5432/vfbiz_api_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate --workspace @vfbiz/api
      - run: npm run prisma:migrate:deploy --workspace @vfbiz/api
      - run: npm run test:integration:postgres --workspace @vfbiz/api

  ai-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_DB: vfbiz_ai_integration
          POSTGRES_USER: vfbiz_integration
          POSTGRES_PASSWORD: vfbiz_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfbiz_integration -d vfbiz_ai_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VFBIZ_RUN_DB_INTEGRATION: "1"
      VFBIZ_AI_DATABASE_URL: postgresql+asyncpg://vfbiz_integration:vfbiz_integration@127.0.0.1:5432/vfbiz_ai_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --group test --frozen
        working-directory: backend/ai
      - run: npm run verify:ai:integration

  drupal-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: drupal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
