    WorkforceOrganizationUnit:
      type: object
      required:
        [
          id,
          externalRef,
          type,
          displayName,
          status,
          source,
          revision,
          observedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        externalRef: { type: string }
        type: { enum: [market, showroom, department] }
        displayName: { type: string }
        status: { type: string }
        source: { type: string }
        revision: { type: string }
        observedAt: { type: string, format: date-time }
    WorkforceAuditEvent:
      type: object
      required: [id, action, resourceType, outcome, correlationId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorRef: { type: [string, "null"] }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: [string, "null"] }
        outcome: { type: string }
        correlationId: { type: string, format: uuid }
