        market: { enum: [VN] }
        releaseVersion: { type: string }
        priceOffers:
          type: array
          items: { $ref: "#/components/schemas/PriceOffer" }
        promotions:
          type: array
          items: { $ref: "#/components/schemas/Promotion" }
